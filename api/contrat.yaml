openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq opérations décrites ici doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Tout le reste de ton API est libre — ajoute tes propres opérations
    dans ce même fichier, sous /api, avant ton premier commit de code.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }
    get:
      summary: Liste des sessions d'une promotion, sans le code (EF8, décision Z3)
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Sessions de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, titre, ouvertureAt, expirationAt, clotureeAt]
                  properties:
                    id: { type: integer, format: int64 }
                    titre: { type: string }
                    ouvertureAt: { type: string, format: date-time }
                    expirationAt: { type: string, format: date-time }
                    clotureeAt: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE
        "429": { $ref: "#/components/responses/Erreur" }   # TROP_DE_TENTATIVES (RG4, décision Z6)

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_HORS_PROMOTION (RG21)
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE (RG6) / SESSION_CLOTUREE (RG15)

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE (RG12) / RELECTEUR_NON_AFFECTE (Z11)
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE (RG14) / SESSION_CLOTUREE (RG15)

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ----------------------------------------------------------------
  # Opérations ajoutées — couverture EF5, EF8 à EF14 (décisions Z3,
  # Z11, C2 du cahier des charges). Contrat figé avant le premier
  # commit de code. Les cinq opérations imposées ci-dessus restent
  # strictement inchangées (chemins, verbes, codes de statut).
  # ----------------------------------------------------------------

  /api/promotions:
    get:
      summary: Liste des promotions pour alimenter les listes des écrans (EF8)
      responses:
        "200":
          description: Promotions disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

  /api/promotions/{id}/etudiants:
    get:
      summary: Liste des étudiants d'une promotion (EF8)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Étudiants de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/promotions/{id}/presences:
    get:
      summary: Présence de chaque étudiant à chaque session (EF14, contradiction C2)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Une ligne par étudiant et par session de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [etudiantId, sessionId, present, source]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    sessionId: { type: integer, format: int64 }
                    present: { type: boolean }
                    source:
                      type: string
                      nullable: true
                      enum: [ETUDIANT, FORMATEUR]
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{id}:
    get:
      summary: Détail d'une session, code de présence compris (EF1, décision Z3)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session demandée
          content:
            application/json:
              schema:
                type: object
                required: [id, titre, promotionId, code, ouvertureAt, expirationAt, clotureeAt]
                properties:
                  id: { type: integer, format: int64 }
                  titre: { type: string }
                  promotionId: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  clotureeAt: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/sessions/{id}/presences:
    post:
      summary: Le formateur ajoute une présence à la main (EF9, RG5)
      description: Source imposée à FORMATEUR, possible même après expiration du code (RG5, Q14)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée par le formateur
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU
        "403": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_HORS_PROMOTION (RG21)
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT (RG3) / SESSION_CLOTUREE (EF10)

  /api/sessions/{id}/cloture:
    post:
      summary: Le formateur clôture une session, définitivement (EF10, RG19)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, clotureeAt]
                properties:
                  id: { type: integer, format: int64 }
                  clotureeAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE (déjà clôturée)

  /api/exercices/{id}:
    put:
      summary: L'étudiant remplace le lien de son exercice (EF11, RG9)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut, lien]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
                  lien: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE (RG7)
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # LIEN_NON_MODIFIABLE (RG9) / SESSION_CLOTUREE

  /api/relectures:
    get:
      summary: Relectures affectées à un étudiant, sans le nom de l'auteur (EF5, RG16)
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures de l'étudiant, à rendre et rendues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, exerciceId, lienExercice, sessionId, sessionTitre, rendue]
                  properties:
                    id: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    lienExercice: { type: string }
                    sessionId: { type: integer, format: int64 }
                    sessionTitre: { type: string }
                    rendue: { type: boolean }
        "400": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

  /api/etudiants/{id}/exercices:
    get:
      summary: Exercices déposés par un étudiant, avec note et commentaire reçus (EF12, RG16)
      description: |
        Statut, note et commentaire sont fournis ; l'identité du relecteur
        n'apparaît jamais (RG16, décision Z14).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Exercices de l'étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, sessionId, sessionTitre, statut, lien, note, commentaire]
                  properties:
                    id: { type: integer, format: int64 }
                    sessionId: { type: integer, format: int64 }
                    sessionTitre: { type: string }
                    statut: { type: string }
                    lien: { type: string }
                    note: { type: integer, nullable: true }
                    commentaire: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
