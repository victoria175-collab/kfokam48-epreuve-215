# Le frontend appelle l'API en chemin relatif (couche api/ unique, F3) :
# nginx redirige /api vers le service backend du reseau Docker.
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
